naftiko: 1.0.0-alpha2
info:
  label: Bubble Data API (Shared)
  description: Shared per-API capability definition for the Bubble Data API. Provides CRUD and search operations against a Bubble app's database.
  tags:
    - Bubble
    - Data API
    - No-Code
    - Database
  created: '2026-05-06'
  modified: '2026-05-06'
binds:
  - namespace: env
    keys:
      BUBBLE_API_TOKEN: BUBBLE_API_TOKEN
      BUBBLE_APP_NAME: BUBBLE_APP_NAME
capability:
  consumes:
    - type: http
      namespace: bubble-data
      baseUri: https://{{BUBBLE_APP_NAME}}.bubbleapps.io/api/1.1
      description: Bubble Data API exposing the app's database for read, search, create, modify, replace, delete, and bulk operations.
      authentication:
        type: bearer
        token: '{{BUBBLE_API_TOKEN}}'
      resources:
        - name: things
          path: /obj/{typename}
          description: Collection of records of a Bubble data type
          operations:
            - name: search-things
              method: GET
              description: Search records of a data type with constraints, sorting, and pagination
              inputParameters:
                - name: typename
                  in: path
                  type: string
                  required: true
                  description: Lowercase data type name (no spaces)
                - name: constraints
                  in: query
                  type: string
                  required: false
                  description: JSON-encoded array of search constraints
                - name: cursor
                  in: query
                  type: integer
                  required: false
                  description: Zero-based pagination cursor
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: Page size (max 100)
                - name: sort_field
                  in: query
                  type: string
                  required: false
                  description: Field to sort by
                - name: descending
                  in: query
                  type: boolean
                  required: false
                  description: Sort direction
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: create-thing
              method: POST
              description: Create a new record
              inputParameters:
                - name: typename
                  in: path
                  type: string
                  required: true
                  description: Lowercase data type name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: thing
          path: /obj/{typename}/{uid}
          description: Individual record operations
          operations:
            - name: get-thing
              method: GET
              description: Retrieve a record by id
              inputParameters:
                - name: typename
                  in: path
                  type: string
                  required: true
                  description: Lowercase data type name
                - name: uid
                  in: path
                  type: string
                  required: true
                  description: Unique record id
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: modify-thing
              method: PATCH
              description: Partially update a record
              inputParameters:
                - name: typename
                  in: path
                  type: string
                  required: true
                  description: Lowercase data type name
                - name: uid
                  in: path
                  type: string
                  required: true
                  description: Unique record id
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: replace-thing
              method: PUT
              description: Replace a record
              inputParameters:
                - name: typename
                  in: path
                  type: string
                  required: true
                  description: Lowercase data type name
                - name: uid
                  in: path
                  type: string
                  required: true
                  description: Unique record id
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: delete-thing
              method: DELETE
              description: Delete a record
              inputParameters:
                - name: typename
                  in: path
                  type: string
                  required: true
                  description: Lowercase data type name
                - name: uid
                  in: path
                  type: string
                  required: true
                  description: Unique record id
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: bulk
          path: /obj/{typename}/bulk
          description: Bulk create up to 1000 records
          operations:
            - name: bulk-create-things
              method: POST
              description: Create up to 1000 records in one request (newline-delimited JSON)
              inputParameters:
                - name: typename
                  in: path
                  type: string
                  required: true
                  description: Lowercase data type name
              outputRawFormat: text
              outputParameters:
                - name: result
                  type: string
                  value: $.
        - name: meta
          path: /meta
          description: Data API metadata for type discovery
          operations:
            - name: get-metadata
              method: GET
              description: Return the data types and fields exposed by this app
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
