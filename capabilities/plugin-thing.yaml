naftiko: 1.0.0-alpha2
info:
  label: Bubble Plugin API — Thing
  description: 'Bubble Plugin API — Thing. 2 operations. Lead operation: Get Thing By Id. Self-contained Naftiko capability
    covering one Bubble business surface.'
  tags:
  - Bubble
  - Thing
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BUBBLE_API_KEY: BUBBLE_API_KEY
capability:
  consumes:
  - type: http
    namespace: plugin-thing
    baseUri: ''
    description: Bubble Plugin API — Thing business capability. Self-contained, no shared references.
    resources:
    - name: thing-id
      path: /thing/{id}
      operations:
      - name: getthingbyid
        method: GET
        description: Get Thing By Id
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    - name: things
      path: /things
      operations:
      - name: getthingsbyid
        method: GET
        description: Get Things By Id
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ids
          in: query
          type: array
          required: true
  exposes:
  - type: rest
    namespace: plugin-thing-rest
    port: 8080
    description: REST adapter for Bubble Plugin API — Thing. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/thing/{id}
      name: thing-id
      description: REST surface for thing-id.
      operations:
      - method: GET
        name: getthingbyid
        description: Get Thing By Id
        call: plugin-thing.getthingbyid
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/things
      name: things
      description: REST surface for things.
      operations:
      - method: GET
        name: getthingsbyid
        description: Get Things By Id
        call: plugin-thing.getthingsbyid
        with:
          ids: rest.ids
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: plugin-thing-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bubble Plugin API — Thing. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-thing-id
      description: Get Thing By Id
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: plugin-thing.getthingbyid
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-things-id
      description: Get Things By Id
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: plugin-thing.getthingsbyid
      with:
        ids: tools.ids
      outputParameters:
      - type: object
        mapping: $.
