openapi: 3.2.0
info:
  title: Bubble Plugin Context API
  description: 'The Bubble Plugin API is a JavaScript SDK surface (not an HTTP API) that plugin

    authors use to extend Bubble apps.'
  version: '4.0'
  contact:
    name: Bubble Support
    url: https://bubble.io/contact
  license:
    name: Bubble Plugin Marketplace Terms
    url: https://bubble.io/legal/plugins
servers:
- url: virtual://plugin-runtime
  description: 'Virtual server. Plugin actions and elements execute inside the Bubble

    runtime; there is no public HTTP endpoint.

    '
tags:
- name: Context
  description: Helpers exposed on the runtime context object.
paths:
  /context/async:
    post:
      tags:
      - Context
      summary: Run Async Block
      description: 'Wrap an asynchronous operation. In v4 this is `context.v3.async()`

        and is deprecated in favor of native `async/await`.'
      operationId: contextAsync
      responses:
        '200':
          description: Async block completed.
  /context/request:
    post:
      tags:
      - Context
      summary: Make HTTP Request
      description: 'Issue an outbound HTTP request from a server-side action. In v4

        this is `context.v3.request()` and is deprecated in favor of any

        npm-installed HTTP client.'
      operationId: contextRequest
      responses:
        '200':
          description: HTTP response.
