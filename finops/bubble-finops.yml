meters:
  - name: workload_units
    unit: wu
    aggregation: sum
    dimensions:
      - activity_type
      - app
      - environment
  - name: subscription_fees
    unit: month
    aggregation: sum
    dimensions:
      - plan_tier
      - billing_frequency
      - bundle_type
  - name: bandwidth
    unit: GB-month
    aggregation: sum
    dimensions:
      - app
      - region
  - name: file_storage
    unit: GB-month
    aggregation: sum
    dimensions:
      - app
  - name: extra_workload_addon
    unit: wu
    aggregation: sum
    dimensions:
      - app
      - month
  - name: app_editors
    unit: seat-month
    aggregation: max
    dimensions:
      - plan_tier
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - environment
      - workflow
      - data_type
principles:
  - name: Visibility
    description: |
      Use the in-app Workload dashboard (Logs > Workload) to see WU consumption
      by activity type, page, scheduled workflow, plugin, and database
      operation. The Server Logs and App Metrics dashboards expose request
      counts and per-page render costs. Export usage data for chargeback to
      external BI tools.
  - name: Allocation
    description: |
      Allocate cost by tagging Bubble apps to teams or products (one app per
      product is the cleanest mapping; sub-apps with white-label allow
      product-level allocation within Growth/Team plans). Use scheduled
      workflow names and plugin labels to attribute WU to features.
  - name: Optimization
    description: |
      Reduce server-side WU by indexing fields used in searches, paginating
      large result sets, replacing repeated server-side actions with
      client-side equivalents, batching writes via the Data API /bulk
      endpoint, and consolidating chained scheduled workflows. Use Bubble's
      Workload optimization guide and the Performance & Capacity dashboard
      to identify hot spots.
  - name: Accountability
    description: |
      Set WU usage alerts in Settings > Workload before crossing plan
      thresholds; assign an app owner per Bubble app. Reconcile monthly
      Bubble invoices against the Workload dashboard and review per-feature
      WU costs in product roadmap reviews.
